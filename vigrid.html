<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GvG Match Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F14;
    --panel:#131A22;
    --panel-border:#223140;
    --text:#E8EEF3;
    --muted:#7C93A6;
    --gold:#E8C15C;
    --wind:#7FE7C4;
    --water:#4FB3E8;
    --fire:#E2643A;
    --earth:#B8925A;
    --fenrir:#C0455A;
    --danger:#FF5D5D;
    --warn:#E8C15C;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:radial-gradient(ellipse at top, #101820 0%, var(--bg) 60%);
    color:var(--text);
    font-family:'Rajdhani',sans-serif;
    padding:14px 16px;
    overflow:hidden; /* whole page must fit in viewport — internal panels scroll instead */
  }
  .wrap{max-width:1000px;margin:0 auto;height:100%;display:flex;flex-direction:column;min-height:0;}
  .top-fixed{flex:0 0 auto;}
  .history-section{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}

  header{
    display:flex;justify-content:space-between;align-items:flex-end;
    flex-wrap:wrap;gap:10px;
    border-bottom:1px solid var(--panel-border);
    padding-bottom:10px;margin-bottom:10px;
  }
  h1{
    font-size:19px;font-weight:700;letter-spacing:0.03em;margin:0;
    color:var(--gold);text-transform:uppercase;
  }
  .clock{
    font-family:'JetBrains Mono',monospace;
    font-size:15px;color:var(--muted);
  }
  .clock b{color:var(--text);}

  .status-bar{
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:10px;padding:10px 16px;margin-bottom:10px;
  }
  .status-line{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  .status-label{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;}
  .status-value{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;color:var(--gold);}

  .track{
    position:relative;height:10px;background:#0d141b;border-radius:6px;margin-top:12px;overflow:visible;
    border:1px solid var(--panel-border);
  }
  .track-fill{position:absolute;top:0;left:0;height:100%;background:linear-gradient(90deg,var(--gold),#f2da8f);border-radius:6px;transition:width .3s;}
  .tick{position:absolute;top:-4px;width:2px;height:18px;background:var(--panel-border);}
  .tick.done{background:var(--gold);}
  .tick-label{position:absolute;top:16px;font-size:11px;color:var(--muted);transform:translateX(-50%);font-family:'JetBrains Mono',monospace;}

  .altar-banner{
    display:none;
    background:linear-gradient(90deg, rgba(232,193,92,0.15), rgba(232,193,92,0.05));
    border:1px solid var(--gold);border-radius:10px;
    padding:8px 16px;margin-bottom:10px;
    font-size:14px;color:var(--gold);font-weight:600;
    animation:pulse-border 1.4s infinite;
  }
  .altar-banner.show{display:block;}
  @keyframes pulse-border{
    0%,100%{box-shadow:0 0 0 0 rgba(232,193,92,0.35);}
    50%{box-shadow:0 0 0 6px rgba(232,193,92,0);}
  }

  .section-title{
    font-size:12px;text-transform:uppercase;letter-spacing:0.08em;
    color:var(--muted);margin:10px 0 6px;font-weight:600;
  }

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;}
  .card{
    background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;
    padding:10px 12px;border-left:3px solid var(--accent,#334);
    display:flex;flex-direction:column;gap:3px;
  }
  .card-name{font-size:14px;font-weight:700;color:var(--text);}
  .card-loc{font-size:11px;color:var(--muted);margin-top:-3px;}
  .card-timer{
    font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;
    color:var(--accent,#fff);margin-top:2px;
  }
  .card-status{font-size:11px;color:var(--muted);}
  .card-timer.due{color:var(--danger);}
  .card-timer.soon{color:var(--warn);}
  .card.clickable{
    cursor:pointer;
    border-color:var(--accent,#556);
    box-shadow:0 0 0 1px var(--accent,#556) inset;
  }
  .card.clickable:hover{
    background:#1a232d;
  }
  .card.clickable:active{
    transform:scale(0.98);
  }
  .card-hint{
    margin-top:8px;font-size:12px;font-weight:600;letter-spacing:0.03em;
    color:var(--muted);
  }
  .card.clickable .card-hint{color:var(--gold);}

  .lock-card .rounds{display:flex;gap:8px;margin-top:6px;}
  .lock-dot{
    flex:1;height:6px;border-radius:4px;background:#0d141b;border:1px solid var(--panel-border);
  }
  .lock-dot.done{background:var(--gold);border-color:var(--gold);}
  .lock-dot.active{background:linear-gradient(90deg,var(--gold),#0d141b);}

  .history-panel{
    background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;
    padding:2px 0;flex:1 1 auto;min-height:0;overflow-y:auto;
  }
  .history-row{
    display:flex;gap:12px;align-items:baseline;
    padding:6px 16px;border-bottom:1px solid var(--panel-border);font-size:13px;
  }
  .history-row:last-child{border-bottom:none;}
  .history-time{
    font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--gold);
    min-width:56px;flex:0 0 auto;
  }
  .history-label{color:var(--text);}
  .history-empty{padding:14px 16px;color:var(--muted);font-size:13px;}

  .test-toggle{
    background:#1a232d;color:var(--warn);border:1px solid var(--panel-border);
    border-radius:6px;padding:6px 10px;font-family:'Rajdhani',sans-serif;font-weight:600;
    cursor:pointer;font-size:13px;
  }
  .test-toggle.active{border-color:var(--warn);color:var(--bg);background:var(--warn);}

  .test-panel{
    display:none;
    background:#1a1710;border:1px dashed var(--warn);border-radius:10px;
    padding:10px 14px;margin-bottom:10px;
  }
  .test-panel.show{display:block;}
  .test-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px;}
  .test-row:last-child{margin-bottom:0;}
  .test-label{font-size:12px;color:var(--muted);min-width:120px;}
  .test-panel button{
    background:#0d141b;color:var(--text);border:1px solid var(--panel-border);
    border-radius:6px;padding:6px 10px;font-family:'JetBrains Mono',monospace;font-size:12px;
    cursor:pointer;
  }
  .test-panel button:hover{border-color:var(--warn);}
  .test-panel button.active{background:var(--warn);color:var(--bg);border-color:var(--warn);}
  #testStateLabel{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--warn);}
</style>
</head>
<body>
<div class="wrap">
  <div class="top-fixed">
  <header>
    <h1>GvG Match Timer</h1>
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="clock">เวลาปัจจุบัน <b id="clockNow">--:--:--</b></div>
      <button id="testToggleBtn" class="test-toggle">🧪 โหมดทดสอบ</button>
    </div>
  </header>

  <div class="test-panel" id="testPanel">
    <div class="test-row">
      <span class="test-label">สถานะ:</span>
      <span id="testStateLabel">ปิดอยู่ — ใช้เวลาจริง</span>
    </div>
    <div class="test-row">
      <button data-test-action="start">▶ เริ่มแมตช์เทสจากวินาที 0</button>
      <button data-test-action="stop">■ ออกจากโหมดทดสอบ (กลับเวลาจริง)</button>
      <button data-test-action="clear">🗑 ล้างสถานะการฆ่าบอสของเทส</button>
    </div>
    <div class="test-row">
      <span class="test-label">ความเร็ว:</span>
      <button data-speed="1">1×</button>
      <button data-speed="5">5×</button>
      <button data-speed="20">20×</button>
      <button data-speed="60">60×</button>
    </div>
    <div class="test-row">
      <span class="test-label">กระโดดไปวินาทีที่:</span>
      <button data-jump="0">0s (เริ่ม)</button>
      <button data-jump="145">145s (ก่อน Sylph/Undine)</button>
      <button data-jump="295">295s (ก่อน Salamander/Gnome)</button>
      <button data-jump="270">270s (ก่อน Lock R1)</button>
      <button data-jump="545">545s (ก่อน Fenrir)</button>
      <button data-jump="1195">1195s (ก่อน Lock R4/จบแมตช์)</button>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-line">
      <div class="status-label" id="statusLabel">สถานะ</div>
      <div class="status-value" id="statusValue">--:--</div>
    </div>
    <div class="track" id="track">
      <div class="track-fill" id="trackFill"></div>
    </div>
  </div>

  <div class="altar-banner" id="altarBanner"></div>

  <div class="section-title">Gjallar Lock</div>
  <div class="cards">
    <div class="card lock-card" style="--accent:#E8C15C">
      <div class="card-name">Gjallar Lock</div>
      <div class="card-loc">เสาจะถูกปิดการใช้งานในอีก </div>
      <div class="card-timer" id="lockTimer">--:--</div>
      <div class="card-status" id="lockStatus">-</div>
      <div class="rounds" id="lockRounds"></div>
    </div>
  </div>

  <div class="section-title">Boss / Elemental Spawns</div>
  <div class="cards" id="bossCards"></div>
  </div><!-- /top-fixed -->

  <div class="history-section">
    <div class="section-title">บันทึกประวัติ (นาทีที่หลังเริ่มแมตช์)</div>
    <div class="history-panel" id="historyLog"></div>
  </div>
</div>

<script>
/* ===================== CONFIG (all values taken directly from the spec you gave) ===================== */
const MATCH_LOCAL_HOUR = 20; // 2 ทุ่ม
const MATCH_DURATION_S = 20*60; // 20 นาที
const LOCK_TIMES_S = [300,600,900,1200]; // Round 1..4 Gjallar lock (5-min intervals)
// ASSUMPTION (flagged, not confirmed by you): Divine Altar "go rebuff" reminder fires this many
// seconds BEFORE each Gjallar Lock. Change this number if the real trigger is different.
const DIVINE_ALTAR_LEAD_S = 30;

const BOSSES = [
  {id:'sylph',      name:'Sylph',      loc:'Wind Altar',  color:'var(--wind)',  initial:150, respawn:420},
  {id:'undine',     name:'Undine',     loc:'Water Altar', color:'var(--water)', initial:150, respawn:420},
  // NOTE: you listed both Salamander and Gnome as spawning at "Earth Altar" — kept exactly as given.
  // If Salamander is actually meant to be a Fire Altar spawn, tell me and I'll fix the label.
  {id:'salamander', name:'Salamander', loc:'Earth Altar', color:'var(--fire)',  initial:300, respawn:360},
  {id:'gnome',      name:'Gnome',      loc:'Earth Altar', color:'var(--earth)', initial:300, respawn:420},
  {id:'fenrir',     name:'Fenrir',     loc:'กลางแมพ (Middle)', color:'var(--fenrir)', initial:550, respawn:320},
];

/* ===================== TIME / MATCH-CYCLE MATH (verified separately with node before wiring here) ===================== */
function getMatchStart(nowMs){
  const d = new Date(nowMs);
  const start = new Date(d.getFullYear(), d.getMonth(), d.getDate(), MATCH_LOCAL_HOUR, 0, 0, 0);
  const end = new Date(start.getTime() + MATCH_DURATION_S*1000);
  if (nowMs >= end.getTime()) start.setDate(start.getDate()+1);
  return start;
}
function pad(n){return String(n).padStart(2,'0');}
function fmtHMS(totalSeconds){
  const sign = totalSeconds < 0 ? '-' : '';
  const s = Math.abs(Math.round(totalSeconds));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  if (h>0) return `${sign}${h}:${pad(m)}:${pad(sec)}`;
  return `${sign}${pad(m)}:${pad(sec)}`;
}

/* ===================== TEST MODE ======================================
   Lets you exercise the whole flow before 20:00 without waiting for real time.
   Design choice (flagged, not something you asked for explicitly, but needed
   for safety): test-mode kills are stored under a fixed key 'boss-state:TEST',
   completely separate from the real per-day key, so testing can never
   corrupt or pre-trigger your actual match-day respawn tracking. Reversible
   any time via "ออกจากโหมดทดสอบ".
   ======================================================================= */
let testMode = false;
let testSpeed = 1;
let testElapsedMs = 0;          // ms since the *simulated* match start
let testVirtualStartEpoch = 0;  // fixed reference epoch, arbitrary when testMode is on

function currentNow(){
  return testMode ? (testVirtualStartEpoch + testElapsedMs) : Date.now();
}
function currentMatchStart(){
  return testMode ? new Date(testVirtualStartEpoch) : getMatchStart(Date.now());
}

async function enterTestMode(){
  testMode = true;
  testVirtualStartEpoch = Date.now();
  testElapsedMs = 0;
  testSpeed = 1;
  lastElapsedChecked = -0.001; // forces the t=0 "แมตช์เริ่ม" crossing to log on the very first tick
  document.getElementById('testStateLabel').textContent = 'เปิดอยู่ — เวลาจำลอง (ไม่กระทบข้อมูลแมตช์จริง)';
  document.getElementById('testToggleBtn').classList.add('active');
  document.querySelectorAll('[data-speed]').forEach(b=>b.classList.toggle('active', b.dataset.speed==='1'));
  await loadStateFor(null); // null => use fixed TEST key
  render();
}
async function exitTestMode(){
  testMode = false;
  lastElapsedChecked = null; // skip backlog — resume logging only from real "now" forward
  document.getElementById('testStateLabel').textContent = 'ปิดอยู่ — ใช้เวลาจริง';
  document.getElementById('testToggleBtn').classList.remove('active');
  await loadStateFor(getMatchStart(Date.now()));
  render();
}
async function clearTestState(){
  if (!testMode) return;
  state = {};
  await saveState();
  render();
}
function jumpTo(seconds){
  if (!testMode) return;
  testElapsedMs = seconds*1000;
  // Skip backlog: jumping doesn't retroactively log everything between the old
  // and new point — only the exact instant landed on (if it lines up with an
  // event), then normal ticking logs whatever comes after.
  lastElapsedChecked = seconds - 0.001;
  render();
}
function setSpeed(x){
  testSpeed = x;
  document.querySelectorAll('[data-speed]').forEach(b=>b.classList.toggle('active', Number(b.dataset.speed)===x));
}

document.getElementById('testToggleBtn').addEventListener('click', ()=>{
  const panel = document.getElementById('testPanel');
  panel.classList.toggle('show');
});
document.querySelectorAll('[data-test-action]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const a = btn.dataset.testAction;
    if (a==='start') enterTestMode();
    if (a==='stop') exitTestMode();
    if (a==='clear') clearTestState();
  });
});
document.querySelectorAll('[data-speed]').forEach(btn=>{
  btn.addEventListener('click', ()=> setSpeed(Number(btn.dataset.speed)));
});
document.querySelectorAll('[data-jump]').forEach(btn=>{
  btn.addEventListener('click', ()=> jumpTo(Number(btn.dataset.jump)));
});

/* ===================== PERSISTED STATE (per-day, per-boss respawn tracking) ===================== */
let state = {};        // { bossId: {...}, history: [{t, label}] }
let stateKey = null;   // storage key for the currently loaded match day
let lastElapsedChecked = null; // null = "baseline not set yet, don't log backlog on next render"

async function loadStateFor(matchStart){
  const key = matchStart ? ('boss-state:' + matchStart.toDateString()) : 'boss-state:TEST';
  stateKey = key;
  try{
    const r = await window.storage.get(key, false);
    state = r && r.value ? JSON.parse(r.value) : {};
  }catch(e){
    state = {}; // key not found yet, or storage unavailable — start fresh, not fatal
  }
}
async function saveState(){
  try{
    await window.storage.set(stateKey, JSON.stringify(state), false);
  }catch(e){
    console.error('storage save failed', e);
  }
}
async function markKilled(bossId, respawnSeconds){
  const now = currentNow();
  const matchStart = currentMatchStart();
  const elapsedAtKill = (now - matchStart.getTime())/1000;
  const boss = BOSSES.find(x=>x.id===bossId);
  state[bossId] = { respawnAt: now + respawnSeconds*1000, everKilled: true };
  logEvent(elapsedAtKill, `${boss.name} ถูกฆ่า (กดโดยผู้เล่น)`);
  await saveState();
  render();
}

/* ===================== HISTORY LOG =====================
   Records what happened and how many seconds after match-start it happened.
   Only logs events crossed WHILE the page is open (no retroactive backlog on
   load / mode-switch / jump — see lastElapsedChecked handling below). This is
   a deliberate scope choice, not a limitation I forgot to mention: I didn't
   build a way to reconstruct events that happened before the page was open. */
function logEvent(elapsedSeconds, label){
  if (!state.history) state.history = [];
  state.history.push({ t: Math.max(0, Math.round(elapsedSeconds)), label });
  if (state.history.length > 100) state.history = state.history.slice(-100);
}

function checkAndLogEvents(prevElapsed, elapsed, matchStartMs){
  if (prevElapsed === null) return false; // baseline call — nothing to detect yet
  if (elapsed <= prevElapsed) return false; // time didn't move forward (e.g. jump backward) — nothing to detect
  let changed = false;
  const crossed = (target) => target > prevElapsed && target <= elapsed;

  if (crossed(0)) { logEvent(0, 'แมตช์เริ่ม'); changed = true; }
  if (crossed(MATCH_DURATION_S)) { logEvent(MATCH_DURATION_S, 'แมตช์จบ (ครบ 20:00)'); changed = true; }

  LOCK_TIMES_S.forEach((t,i)=>{
    const altarT = t - DIVINE_ALTAR_LEAD_S;
    if (crossed(altarT)) { logEvent(altarT, `Divine Altar: เตือนไปรีบัพ (ก่อน Round ${i+1})`); changed = true; }
    if (crossed(t)) { logEvent(t, `Round ${i+1} Gjallar Lock`); changed = true; }
  });

  BOSSES.forEach(b=>{
    const nextAbs = bossNextAbs(b, matchStartMs);
    const targetElapsed = (nextAbs - matchStartMs)/1000;
    if (crossed(targetElapsed)){
      const isRespawn = !!(state[b.id] && state[b.id].everKilled);
      logEvent(targetElapsed, isRespawn ? `${b.name} เกิดใหม่ (Respawn) ที่ ${b.loc}` : `${b.name} เกิดครั้งแรกที่ ${b.loc}`);
      changed = true;
    }
  });

  return changed;
}

function renderHistory(){
  const box = document.getElementById('historyLog');
  const hist = state.history || [];
  if (hist.length === 0){
    box.innerHTML = `<div class="history-empty">ยังไม่มีเหตุการณ์เกิดขึ้น — จะเริ่มบันทึกอัตโนมัติเมื่อแมตช์เริ่ม</div>`;
    return;
  }
  box.innerHTML = hist.slice().reverse().map(ev=>`
    <div class="history-row">
      <div class="history-time">${fmtHMS(ev.t)}</div>
      <div class="history-label">${ev.label}</div>
    </div>
  `).join('');
}

/* ===================== RENDER ===================== */
function bossNextAbs(boss, matchStartMs){
  const s = state[boss.id];
  return s && s.respawnAt ? s.respawnAt : (matchStartMs + boss.initial*1000);
}

function buildBossCards(){
  const wrap = document.getElementById('bossCards');
  wrap.innerHTML = BOSSES.map(b => `
    <div class="card" style="--accent:${b.color}" data-id="${b.id}">
      <div class="card-name">${b.name}</div>
      <div class="card-loc">${b.loc}</div>
      <div class="card-timer" data-timer>--:--</div>
      <div class="card-status" data-status>-</div>
      <div class="card-hint" data-hint></div>
    </div>
  `).join('');
  wrap.querySelectorAll('.card').forEach(card=>{
    const id = card.dataset.id;
    const boss = BOSSES.find(x=>x.id===id);
    card.addEventListener('click', ()=>{
      if (!card.classList.contains('clickable')) return; // not spawned yet — ignore click
      markKilled(boss.id, boss.respawn);
    });
  });
}

function render(){
  const now = currentNow();
  const matchStart = currentMatchStart();

  // reload state if the match day rolled over (real mode only — test mode uses a fixed key)
  if (!testMode && stateKey !== 'boss-state:' + matchStart.toDateString()){
    lastElapsedChecked = null; // new day/match — don't compare against yesterday's stale elapsed value
    loadStateFor(matchStart).then(render);
    return;
  }

  const elapsed = (now - matchStart.getTime())/1000;
  const clockNow = new Date(); // header clock always shows real wall time, even in test mode
  document.getElementById('clockNow').textContent =
    `${pad(clockNow.getHours())}:${pad(clockNow.getMinutes())}:${pad(clockNow.getSeconds())}`;

  // ---- history log: detect newly-crossed events since the last render tick ----
  const historyChanged = checkAndLogEvents(lastElapsedChecked, elapsed, matchStart.getTime());
  lastElapsedChecked = elapsed;
  if (historyChanged){
    saveState().catch(e=>console.error('history save failed', e));
  }
  renderHistory();

  // ---- top status ----
  const statusLabel = document.getElementById('statusLabel');
  const statusValue = document.getElementById('statusValue');
  const trackFill = document.getElementById('trackFill');

  if (elapsed < 0){
    statusLabel.textContent = 'รอบถัดไปเริ่มใน';
    statusValue.textContent = fmtHMS(-elapsed);
    trackFill.style.width = '0%';
  } else {
    statusLabel.textContent = 'แมตช์กำลังดำเนินอยู่ (เหลือเวลา)';
    statusValue.textContent = fmtHMS(MATCH_DURATION_S - elapsed);
    trackFill.style.width = Math.min(100,(elapsed/MATCH_DURATION_S*100)) + '%';
  }

  // build tick marks once
  const track = document.getElementById('track');
  if (!track.dataset.built){
    LOCK_TIMES_S.forEach((t,i)=>{
      const pct = t/MATCH_DURATION_S*100;
      const tick = document.createElement('div');
      tick.className='tick'; tick.style.left = pct+'%'; tick.dataset.t=t;
      track.appendChild(tick);
      const label = document.createElement('div');
      label.className='tick-label'; label.style.left=pct+'%';
      label.textContent = 'R'+(i+1);
      track.appendChild(label);
    });
    track.dataset.built='1';
  }
  track.querySelectorAll('.tick').forEach(tick=>{
    tick.classList.toggle('done', elapsed >= Number(tick.dataset.t));
  });

  // ---- Gjallar lock ----
  const nextLockIdx = LOCK_TIMES_S.findIndex(t => elapsed < t);
  const lockTimer = document.getElementById('lockTimer');
  const lockStatus = document.getElementById('lockStatus');
  const altarBanner = document.getElementById('altarBanner');

  if (elapsed < 0){
    lockTimer.textContent = '--:--';
    lockStatus.textContent = 'รอเริ่มแมตช์';
    altarBanner.classList.remove('show');
  } else if (nextLockIdx === -1){
    lockTimer.textContent = '00:00';
    lockStatus.textContent = 'ล็อกครบ 4 รอบแล้ว';
    altarBanner.classList.remove('show');
  } else {
    const remain = LOCK_TIMES_S[nextLockIdx] - elapsed;
    lockTimer.textContent = fmtHMS(remain);
    lockTimer.className = 'card-timer' + (remain<=10?' due':remain<=60?' soon':'');
    lockStatus.textContent = `Round ${nextLockIdx+1} Gjallar Lock`;
    if (remain <= DIVINE_ALTAR_LEAD_S){
      altarBanner.classList.add('show');
      altarBanner.textContent = `🔔 Divine Altar: ผู้ถือ Gjallar Horn เตรียมไปกดรีบัพ — เหลือ ${Math.ceil(remain)}s ก่อน Round ${nextLockIdx+1} Lock`;
    } else {
      altarBanner.classList.remove('show');
    }
  }
  document.getElementById('lockRounds').innerHTML = LOCK_TIMES_S.map((t,i)=>{
    const cls = elapsed>=t ? 'done' : (i===nextLockIdx ? 'active' : '');
    return `<div class="lock-dot ${cls}"></div>`;
  }).join('');

  // ---- boss cards ----
  BOSSES.forEach(b=>{
    const card = document.querySelector(`.card[data-id="${b.id}"]`);
    if (!card) return;
    const timerEl = card.querySelector('[data-timer]');
    const statusEl = card.querySelector('[data-status]');
    const hintEl = card.querySelector('[data-hint]');

    if (elapsed < 0){
      timerEl.textContent = '--:--';
      timerEl.className = 'card-timer';
      statusEl.textContent = 'รอเริ่มแมตช์';
      hintEl.textContent = '';
      card.classList.remove('clickable');
      return;
    }

    const nextAbs = bossNextAbs(b, matchStart.getTime());
    const remainS = (nextAbs - now)/1000;

    if (remainS <= 0){
      timerEl.textContent = 'เกิดแล้ว!';
      timerEl.className = 'card-timer due';
      statusEl.textContent = 'รอกดที่กรอบนี้เมื่อตายแล้ว';
      hintEl.textContent = '👆 คลิกที่นี่เมื่อตายแล้ว';
      card.classList.add('clickable');
    } else {
      timerEl.textContent = fmtHMS(remainS);
      timerEl.className = 'card-timer' + (remainS<=10?' due':remainS<=60?' soon':'');
      statusEl.textContent = state[b.id]?.everKilled ? 'นับเวลาการเกิดใหม่' : 'นับเวลาเกิดครั้งแรก';
      hintEl.textContent = '';
      card.classList.remove('clickable');
    }
  });
}

/* ===================== INIT ===================== */
buildBossCards();
loadStateFor(getMatchStart(Date.now())).then(()=>{
  render();
  setInterval(()=>{
    if (testMode) testElapsedMs += 1000*testSpeed;
    render();
  }, 1000);
});
</script>
